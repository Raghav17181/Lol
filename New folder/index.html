<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy 1 Month!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #4a4a4a;
      overflow: hidden;
      position: relative;
    }

    /* Animated background elements */
    .bg-symbol {
      position: absolute;
      user-select: none;
      pointer-events: none;
      animation: float 6s ease-in-out infinite alternate;
      z-index: 1;
      opacity: 0.7;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-20px) rotate(15deg); }
    }

    /* Page container setup */
    .page {
      position: absolute;
      width: 100%;
      max-width: 900px;
      padding: 20px;
      z-index: 10;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), 
                  transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.9) translateY(30px);
    }

    .visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
    }

    /* Page 1 Styles */
    h1 {
      font-size: 2.5rem;
      color: #d63384;
      margin-bottom: 25px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .button-container {
      position: relative;
      display: inline-block;
      margin-top: 15px;
    }

    .red-dot {
      height: 28px;
      width: 28px;
      background-color: #ff4d6d;
      border-radius: 50%;
      display: inline-block;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(255, 77, 109, 0.8);
      animation: pulse 1.5s infinite;
      transition: transform 0.2s ease;
    }

    .red-dot:hover {
      transform: scale(1.3);
      box-shadow: 0 0 20px rgba(255, 77, 109, 1);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .arrow-pointer {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #c2255c;
      font-weight: bold;
      font-size: 0.95rem;
      width: 150px;
      animation: bounce 1.5s infinite;
    }

    .arrow-pointer span {
      font-size: 1.5rem;
      line-height: 1;
    }

    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, 8px); }
    }

    /* Page 2 Gallery Styles */
    .gallery {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .photo-card {
      background: white;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      width: 240px;
      z-index: 5;
    }

    .photo-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 8px;
    }

    .subtext {
      font-size: 1.6rem;
      font-weight: 700;
      color: #c2255c;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
      position: relative;
      z-index: 5;
    }
  </style>
</head>
<body>

  <audio id="bg-music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <div id="bg-layer"></div>

  <div id="page1" class="page visible">
    <h1>Happy 1 month of our relationship darling❣</h1>
    <div class="button-container">
      <div class="red-dot" id="dot-btn" title="Click me!"></div>
      <div class="arrow-pointer">
        <span>↑</span>
        click the red button
      </div>
    </div>
  </div>

  <div id="page2" class="page hidden">
    <div class="gallery">
      <div class="photo-card">
        <img src="photo1.jpeg" alt="Memory 1" />
      </div>
      <div class="photo-card">
        <img src="photo2.jpeg" alt="Memory 2" />
      </div>
      <div class="photo-card">
        <img src="photo3.jpeg" alt="Memory 3" />
      </div>
    </div>
    <p class="subtext">Thanks for tolerating me for 1 month and many more</p>
  </div>

  <script>
    const dotBtn = document.getElementById('dot-btn');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const music = document.getElementById('bg-music');
    const bgLayer = document.getElementById('bg-layer');

    // Function to generate scattered background decorations
    function generateDecorations(type) {
      bgLayer.innerHTML = ''; // clear current symbols
      const symbols = type === 'page1' ? ['❤️', '💖', '💕', '💗'] : ['❤️', '👁️', '💖', '👀', '💕'];
      const count = 30;

      for (let i = 0; i < count; i++) {
        const span = document.createElement('span');
        span.className = 'bg-symbol';
        span.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.left = Math.random() * 95 + 'vw';
        span.style.top = Math.random() * 95 + 'vh';
        span.style.fontSize = (Math.random() * 20 + 18) + 'px';
        span.style.animationDelay = (Math.random() * 3) + 's';
        span.style.animationDuration = (Math.random() * 3 + 4) + 's';
        bgLayer.appendChild(span);
      }
    }

    // Initialize Page 1 background hearts
    generateDecorations('page1');

    dotBtn.addEventListener('click', () => {
      // Transition pages with zoom & fade effect
      page1.classList.remove('visible');
      page1.classList.add('hidden');
      
      setTimeout(() => {
        generateDecorations('page2'); // Switch to hearts & eyes background
        page2.classList.remove('hidden');
        page2.classList.add('visible');
      }, 300);

      // Play audio on click interaction
      music.play().catch(error => {
        console.log("Audio play deferred by browser:", error);
      });
    });
  </script>
</body>
</html>
